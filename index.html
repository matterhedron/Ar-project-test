<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Matterhedron AR</title>


  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>


  <!-- A-FRAME EXTRAS -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>


  <!-- MINDAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }


    #instructions {

      position: fixed;

      top: 20px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 9999;

      background: rgba(0,0,0,0.75);

      color: white;

      padding: 12px 20px;

      border-radius: 8px;

      text-align: center;

      font-size: 14px;

      white-space: nowrap;

    }


    #resetButton {

      position: fixed;

      bottom: 25px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 9999;

      background: rgba(0,0,0,0.75);

      color: white;

      border: 1px solid rgba(255,255,255,0.5);

      padding: 10px 16px;

      border-radius: 20px;

      font-size: 13px;

      cursor: pointer;

    }

  </style>

</head>



<body>


  <div id="instructions">

    Loading AR...

  </div>



  <button id="resetButton">

    Reset to Artwork

  </button>



  <!-- =====================================================
       AR SCENE
       ===================================================== -->


  <a-scene

    id="ar-scene"

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      missTolerance: 30;
      warmupTolerance: 5;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

  >



    <!-- CAMERA -->


    <a-camera

      position="0 0 0"

      look-controls="enabled: false">

    </a-camera>



    <!-- ===================================================
         TRACKED ARTWORK
         =================================================== -->


    <a-entity

      id="target"

      mindar-image-target="targetIndex: 0">



      <!-- =================================================
           NEW MODEL

           TEST2026 forces the browser to treat this
           as a new model URL.
           ================================================= -->


      <a-gltf-model

        id="ar-model"

        src="./model.glb?v=TEST2026"

        position="0 0 0.1"

        rotation="90 0 0"

        scale="0.3 0.3 0.3"

        animation-mixer="
          clip: *;
          loop: repeat;
        ">

      </a-gltf-model>


    </a-entity>


  </a-scene>



<script>


/* =========================================================
   ELEMENTS
   ========================================================= */


const scene =
  document.querySelector("#ar-scene");


const target =
  document.querySelector("#target");


const model =
  document.querySelector("#ar-model");


const instructions =
  document.querySelector("#instructions");


const resetButton =
  document.querySelector("#resetButton");




/* =========================================================
   MODEL LOADED
   ========================================================= */


model.addEventListener(

  "model-loaded",

  function () {


    console.log(
      "NEW MODEL LOADED"
    );


    instructions.style.display =
      "block";


    instructions.innerText =
      "3D model loaded";


    setTimeout(

      function () {


        instructions.innerText =
          "Point your camera at the artwork";


      },

      1200

    );


  }

);




/* =========================================================
   MODEL ERROR
   ========================================================= */


model.addEventListener(

  "model-error",

  function (event) {


    console.error(
      "MODEL ERROR:",
      event
    );


    console.error(
      "DETAIL:",
      event.detail
    );


    instructions.style.display =
      "block";


    instructions.innerText =
      "3D model failed to load";


  }

);




/* =========================================================
   AR READY
   ========================================================= */


scene.addEventListener(

  "arReady",

  function () {


    console.log(
      "AR READY"
    );


    instructions.style.display =
      "block";


    instructions.innerText =
      "Point your camera at the artwork";


  }

);




/* =========================================================
   TARGET FOUND
   ========================================================= */


target.addEventListener(

  "targetFound",

  function () {


    console.log(
      "ARTWORK FOUND"
    );


    instructions.style.display =
      "block";


    instructions.innerText =
      "Artwork found";


    setTimeout(

      function () {


        instructions.style.display =
          "none";


      },

      1000

    );


  }

);




/* =========================================================
   TARGET LOST
   ========================================================= */


target.addEventListener(

  "targetLost",

  function () {


    console.log(
      "ARTWORK LOST"
    );


    instructions.style.display =
      "block";


    instructions.innerText =
      "Reacquiring artwork...";


  }

);




/* =========================================================
   RESET
   ========================================================= */


resetButton.addEventListener(

  "click",

  async function () {


    resetButton.innerText =
      "Resetting...";


    instructions.style.display =
      "block";


    instructions.innerText =
      "Resetting tracking...";


    const mindarSystem =
      scene.systems[
        "mindar-image-system"
      ];


    if (mindarSystem) {


      try {


        await mindarSystem.stop();


        await mindarSystem.start();


        instructions.innerText =
          "Point your camera at the artwork";


      }


      catch (error) {


        console.error(
          "RESET ERROR:",
          error
        );


        instructions.innerText =
          "Reset failed";


      }


    }


    resetButton.innerText =
      "Reset to Artwork";


  }

);


</script>


</body>

</html>
