<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Matterhedron AR</title>


  <!-- =====================================================
       LIBRARIES
       ===================================================== -->


  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>


  <!-- A-FRAME EXTRAS - GLB ANIMATION SUPPORT -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>


  <!-- MINDAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>



  <!-- =====================================================
       PAGE STYLE
       ===================================================== -->


  <style>

    body {

      margin: 0;

      overflow: hidden;

      font-family: Arial, sans-serif;

    }



    /* STATUS MESSAGE */


    #instructions {

      position: fixed;

      top: 20px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 9999;

      background: rgba(0,0,0,0.75);

      color: white;

      padding: 12px 20px;

      border-radius: 8px;

      text-align: center;

      font-size: 14px;

      white-space: nowrap;

    }



    /* RESET BUTTON */


    #resetButton {

      position: fixed;

      bottom: 25px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 9999;

      background: rgba(0,0,0,0.75);

      color: white;

      border: 1px solid rgba(255,255,255,0.5);

      padding: 10px 16px;

      border-radius: 20px;

      font-size: 13px;

      cursor: pointer;

    }



    #resetButton:active {

      background: white;

      color: black;

    }

  </style>

</head>



<body>



  <!-- =====================================================
       STATUS MESSAGE
       ===================================================== -->


  <div id="instructions">

    Loading AR...

  </div>



  <!-- =====================================================
       RESET BUTTON
       ===================================================== -->


  <button id="resetButton">

    Reset to Artwork

  </button>



  <!-- =====================================================
       AR SCENE
       ===================================================== -->


  <a-scene

    id="ar-scene"

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      missTolerance: 30;
      warmupTolerance: 5;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

  >



    <!-- ===================================================
         CAMERA
         =================================================== -->


    <a-camera

      position="0 0 0"

      look-controls="enabled: false">

    </a-camera>



    <!-- ===================================================
         LIGHTING
         =================================================== -->


    <!--
      AMBIENT LIGHT

      Provides general illumination across
      the entire model.

      Increase intensity if the model is
      still too dark.
    -->


    <a-light

      type="ambient"

      color="#FFFFFF"

      intensity="1.5">

    </a-light>



    <!--
      DIRECTIONAL LIGHT

      Gives the model shape and definition.

      Think of this as the main light source.
    -->


    <a-light

      type="directional"

      color="#FFFFFF"

      intensity="1.5"

      position="1 2 2">

    </a-light>



    <!-- ===================================================
         TRACKED ARTWORK
         =================================================== -->


    <a-entity

      id="target"

      mindar-image-target="targetIndex: 0">



      <!-- =================================================
           3D MODEL
           ================================================= -->


      <a-gltf-model

        id="ar-model"

        src="./model.glb?v=TEST2026"

        position="0 0 0.1"

        rotation="90 0 0"

        scale="0.3 0.3 0.3"

        animation-mixer="
          clip: *;
          loop: repeat;
        ">

      </a-gltf-model>


    </a-entity>


  </a-scene>



<script>


/* =========================================================
   GET PAGE ELEMENTS
   ========================================================= */


const scene =
  document.querySelector("#ar-scene");


const target =
  document.querySelector("#target");


const model =
  document.querySelector("#ar-model");


const instructions =
  document.querySelector("#instructions");


const resetButton =
  document.querySelector("#resetButton");




/* =========================================================
   MODEL LOADED
   ========================================================= */


model.addEventListener(

  "model-loaded",

  function () {


    console.log(
      "3D MODEL LOADED SUCCESSFULLY"
    );


    instructions.style.display =
      "block";


    instructions.innerText =
      "3D model loaded";


    setTimeout(

      function () {


        instructions.innerText =
          "Point your camera at the artwork";


      },

      1200

    );


  }

);




/* =========================================================
   MODEL ERROR
   ========================================================= */


model.addEventListener(

  "model-error",

  function (event) {


    console.error(
      "MODEL ERROR:",
      event
    );


    console.error(
      "MODEL ERROR DETAILS:",
      event.detail
    );


    instructions.style.display =
      "block";


    instructions.innerText =
      "3D model failed to load";


  }

);




/* =========================================================
   AR READY
   ========================================================= */


scene.addEventListener(

  "arReady",

  function () {


    console.log(
      "AR READY"
    );


    instructions.style.display =
      "block";


    instructions.innerText =
      "Point your camera at the artwork";


  }

);




/* =========================================================
   ARTWORK FOUND
   ========================================================= */


target.addEventListener(

  "targetFound",

  function () {


    console.log(
      "ARTWORK FOUND"
    );


    instructions.style.display =
      "block";


    instructions.innerText =
      "Artwork found";


    setTimeout(

      function () {


        instructions.style.display =
          "none";


      },

      1000

    );


  }

);




/* =========================================================
   ARTWORK LOST
   ========================================================= */


target.addEventListener(

  "targetLost",

  function () {


    console.log(
      "ARTWORK LOST"
    );


    instructions.style.display =
      "block";


    instructions.innerText =
      "Reacquiring artwork...";


  }

);




/* =========================================================
   RESET BUTTON
   ========================================================= */


resetButton.addEventListener(

  "click",

  async function () {


    resetButton.innerText =
      "Resetting...";


    instructions.style.display =
      "block";


    instructions.innerText =
      "Resetting tracking...";



    /* -----------------------------------------
       RESET MODEL TRANSFORM
       ----------------------------------------- */


    model.setAttribute(

      "position",

      "0 0 0.1"

    );


    model.setAttribute(

      "rotation",

      "90 0 0"

    );


    model.setAttribute(

      "scale",

      "0.3 0.3 0.3"

    );



    /* -----------------------------------------
       GET MINDAR SYSTEM
       ----------------------------------------- */


    const mindarSystem =
      scene.systems[
        "mindar-image-system"
      ];



    /* -----------------------------------------
       RESTART TRACKING
       ----------------------------------------- */


    if (mindarSystem) {


      try {


        await mindarSystem.stop();


        await mindarSystem.start();


        instructions.innerText =
          "Point your camera at the artwork";


      }


      catch (error) {


        console.error(
          "RESET ERROR:",
          error
        );


        instructions.innerText =
          "Reset failed";


      }


    }



    resetButton.innerText =
      "Reset to Artwork";


  }

);


</script>


</body>

</html>
