<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AR Test</title>


  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>


  <!-- A-FRAME EXTRAS - GLB ANIMATION SUPPORT -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>


  <!-- MINDAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }


    /* TOP INSTRUCTIONS */

    #instructions {

      position: fixed;

      top: 20px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 9999;

      background: rgba(0,0,0,0.75);

      color: white;

      padding: 12px 20px;

      border-radius: 8px;

      text-align: center;

      font-size: 14px;

      white-space: nowrap;

    }



    /* RESET BUTTON */

    #resetButton {

      position: fixed;

      bottom: 25px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 9999;

      background: rgba(0,0,0,0.75);

      color: white;

      border: 1px solid rgba(255,255,255,0.5);

      padding: 10px 16px;

      border-radius: 20px;

      font-size: 13px;

      cursor: pointer;

    }


    #resetButton:active {

      background: white;

      color: black;

    }

  </style>

</head>



<body>


  <!-- STATUS MESSAGE -->

  <div id="instructions">

    Loading AR...

  </div>



  <!-- RESET BUTTON -->

  <button id="resetButton">

    Reset to Artwork

  </button>



  <!-- AR SCENE -->

  <a-scene

    id="ar-scene"

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded

  >



    <!-- ASSETS -->

    <a-assets>

      <a-asset-item
        id="modelAsset">
      </a-asset-item>

    </a-assets>



    <!-- CAMERA -->

    <a-camera

      position="0 0 0"

      look-controls="enabled: false">

    </a-camera>



    <!-- TRACKED ARTWORK -->

    <a-entity

      id="target"

      mindar-image-target="targetIndex: 0">


      <!-- 3D MODEL -->

      <a-gltf-model

        id="ar-model"

        src="#modelAsset"

        position="0 0 0"

        rotation="90 0 0"

        scale="0.3 0.3 0.3"

        animation-mixer="
          clip: *;
          loop: repeat;
        ">

      </a-gltf-model>


    </a-entity>


  </a-scene>




<script>


/* =========================================================
   AR DEVELOPMENT TEMPLATE
   ========================================================= */


const scene =
  document.querySelector("#ar-scene");


const target =
  document.querySelector("#target");


const model =
  document.querySelector("#ar-model");


const modelAsset =
  document.querySelector("#modelAsset");


const resetButton =
  document.querySelector("#resetButton");


const instructions =
  document.querySelector("#instructions");




/* =========================================================
   CACHE BUSTING
   =========================================================

   Generate a unique version number every time
   the webpage loads.

   This prevents the phone from using an old
   model.glb or targets.mind file.

*/


const version = Date.now();


const modelURL =
  "./model.glb?v=" + version;


const targetURL =
  "./targets.mind?v=" + version;



console.log("AR Version:", version);

console.log("Loading model:", modelURL);

console.log("Loading target:", targetURL);




/* =========================================================
   LOAD LATEST MODEL
   ========================================================= */


modelAsset.setAttribute(
  "src",
  modelURL
);




/* =========================================================
   CONFIGURE MINDAR
   ========================================================= */


scene.setAttribute(

  "mindar-image",

  `imageTargetSrc: ${targetURL};
   autoStart: true;
   missTolerance: 30;
   warmupTolerance: 5;`

);




/* =========================================================
   AR READY
   ========================================================= */


scene.addEventListener(

  "arReady",

  () => {

    instructions.innerText =
      "Point your camera at the artwork";

  }

);




/* =========================================================
   AR ERROR
   ========================================================= */


scene.addEventListener(

  "arError",

  () => {

    instructions.innerText =
      "AR failed to start";

  }

);




/* =========================================================
   TARGET FOUND
   ========================================================= */


target.addEventListener(

  "targetFound",

  () => {

    console.log("Artwork found");

    instructions.innerText =
      "Artwork found";



    /*
      Hide the message after a short delay.
    */


    setTimeout(

      () => {

        instructions.style.display =
          "none";

      },

      1000

    );

  }

);




/* =========================================================
   TARGET LOST
   ========================================================= */


target.addEventListener(

  "targetLost",

  () => {

    console.log("Artwork lost");


    instructions.style.display =
      "block";


    instructions.innerText =
      "Reacquiring artwork...";

  }

);




/* =========================================================
   RESET BUTTON
   ========================================================= */


resetButton.addEventListener(

  "click",

  async () => {


    resetButton.innerText =
      "Resetting...";


    instructions.style.display =
      "block";


    instructions.innerText =
      "Resetting tracking...";



    /* -----------------------------------------
       RESET MODEL
       ----------------------------------------- */


    model.setAttribute(
      "position",
      "0 0 0"
    );


    model.setAttribute(
      "rotation",
      "90 0 0"
    );


    model.setAttribute(
      "scale",
      "0.3 0.3 0.3"
    );



    /* -----------------------------------------
       RESET MINDAR
       ----------------------------------------- */


    const mindarSystem =
      scene.systems["mindar-image-system"];


    if (mindarSystem) {


      try {


        await mindarSystem.stop();


        instructions.innerText =
          "Point your camera at the artwork";


        await mindarSystem.start();


      }


      catch (error) {


        console.error(
          "AR reset error:",
          error
        );


        instructions.innerText =
          "Unable to reset AR";


      }


    }



    resetButton.innerText =
      "Reset to Artwork";


  }

);


</script>


</body>

</html>
