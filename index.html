<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AR Test</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #instructions {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;

      background: rgba(0,0,0,0.75);
      color: white;

      padding: 12px 20px;
      border-radius: 8px;

      text-align: center;
      font-size: 14px;
    }

  </style>

</head>


<body>

  <div id="instructions">
    Point your camera at the artwork
  </div>


  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

  >


    <!-- Load our Blender model -->

    <a-assets>

      <a-asset-item
        id="model"
        src="./model.glb">
      </a-asset-item>

    </a-assets>


    <!-- Camera -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- Image target -->

    <a-entity mindar-image-target="targetIndex: 0">


      <!-- Blender model -->

      <a-gltf-model

        src="#model"

        position="0 0 0"

        rotation="90 0 0"

        scale="0.5 0.5 0.5">

      </a-gltf-model>


    </a-entity>


  </a-scene>


</body>

</html>
