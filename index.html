<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AR Test</title>


  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- A-Frame Extras - allows GLB animations -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }


    #instructions {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;

      background: rgba(0,0,0,0.75);
      color: white;

      padding: 12px 20px;
      border-radius: 8px;

      text-align: center;
      font-size: 14px;
    }


    /* RESET BUTTON */

    #resetButton {

      position: fixed;

      bottom: 25px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 9999;

      background: rgba(0,0,0,0.75);
      color: white;

      border: 1px solid rgba(255,255,255,0.5);

      padding: 10px 16px;

      border-radius: 20px;

      font-size: 13px;

      cursor: pointer;

    }


    #resetButton:active {

      background: rgba(255,255,255,0.9);
      color: black;

    }

  </style>

</head>


<body>


  <div id="instructions">
    Point your camera at the artwork
  </div>


  <button id="resetButton">
    Reset to Artwork
  </button>



  <a-scene

    id="ar-scene"

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      missTolerance: 30;
      warmupTolerance: 5;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

  >


    <!-- ASSETS -->

    <a-assets>

      <a-asset-item
        id="model"
        src="./model.glb">
      </a-asset-item>

    </a-assets>



    <!-- CAMERA -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>



    <!-- TRACKED ARTWORK -->

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0">


      <!-- ANIMATED BLENDER MODEL -->

      <a-gltf-model

        id="ar-model"

        src="#model"

        position="0 0 0"

        rotation="90 0 0"

        scale="0.3 0.3 0.3"

        animation-mixer="
          clip: *;
          loop: repeat;
        ">

      </a-gltf-model>


    </a-entity>


  </a-scene>



  <script>

    const scene = document.querySelector("#ar-scene");
    const model = document.querySelector("#ar-model");
    const resetButton = document.querySelector("#resetButton");
    const instructions = document.querySelector("#instructions");


    resetButton.addEventListener("click", async () => {

      /* Change button text temporarily */

      resetButton.innerText = "Resetting...";


      /*
       * Reset model transform.
       * These values match the original
       * values in the HTML above.
       */

      model.setAttribute("position", "0 0 0");
      model.setAttribute("rotation", "90 0 0");
      model.setAttribute("scale", "0.3 0.3 0.3");


      /*
       * Restart MindAR.
       * This clears the current tracking
       * estimate and forces the artwork
       * to be detected again.
       */

      const mindarSystem =
        scene.systems["mindar-image-system"];


      if (mindarSystem) {

        try {

          await mindarSystem.stop();

          instructions.innerText =
            "Point your camera at the artwork";

          await mindarSystem.start();

        }

        catch (error) {

          console.log("AR reset error:", error);

        }

      }


      resetButton.innerText =
        "Reset to Artwork";

    });

  </script>


</body>

</html>
